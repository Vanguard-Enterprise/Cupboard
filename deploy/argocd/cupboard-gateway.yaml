# Copy into v-deployments/argocd/applications/use1/ to register.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cupboard-gateway
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: gateway=ghcr.io/vanguard-enterprise/cupboard-gateway:main
    argocd-image-updater.argoproj.io/gateway.update-strategy: digest
    argocd-image-updater.argoproj.io/gateway.pull-secret: pullsecret:argocd/ghcr-image-updater
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/argocd-image-updater-git
    argocd-image-updater.argoproj.io/write-back-target: kustomization
    argocd-image-updater.argoproj.io/git-branch: main
spec:
  project: default
  source:
    repoURL: https://github.com/Vanguard-Enterprise/v-deployments
    targetRevision: main
    path: applications/cupboard/overlays/gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: cupboard-gateway
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-cupboard
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Vanguard-Enterprise/v-deployments
    targetRevision: main
    path: applications/cloudnative-postgres/overlays/cupboard
  destination:
    server: https://kubernetes.default.svc
    namespace: cupboard-db
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
