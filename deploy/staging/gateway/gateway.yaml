apiVersion: v1
kind: Namespace
metadata:
  name: cupboard-gateway
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cupboard-gateway-config
  namespace: cupboard-gateway
data:
  BIND_ADDR: "0.0.0.0:8080"
  ENVIRONMENT: "staging"
  # tower_http span is emitted at INFO so it survives the filter and exports as a trace.
  RUST_LOG: "info,sqlx=warn,tower_http=info"
  # Observability → cluster alloy-receiver. Presence of OTEL_EXPORTER_OTLP_ENDPOINT
  # switches the app from logs-only to logs + OTLP traces + OTLP metrics (gRPC :4317).
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy-receiver.alloy-receiver.svc.cluster.local:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  OTEL_SERVICE_NAME: "cupboard-gateway"
---
# Composes DATABASE_URL (pointing at the CNPG rw pooler) from Vault creds.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cupboard-gateway-secrets
  namespace: cupboard-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cupboard-gateway-secrets
    template:
      data:
        DATABASE_URL: "postgres://{{ .username }}:{{ .password }}@cupboard-pooled-rw.cupboard-db.svc.cluster.local:5432/cupboard?sslmode=require"
  data:
    - secretKey: username
      remoteRef: { key: cupboard/staging/pg/cupboard, property: username }
    - secretKey: password
      remoteRef: { key: cupboard/staging/pg/cupboard, property: db_password }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cupboard-gateway
  namespace: cupboard-gateway
spec:
  replicas: 2
  selector:
    matchLabels: { app: cupboard-gateway }
  template:
    metadata:
      labels: { app: cupboard-gateway }
    spec:
      imagePullSecrets:
        - name: github-pull-secret
      containers:
        - name: gateway
          image: ghcr.io/vanguard-enterprise/cupboard-gateway:main
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: cupboard-gateway-config }
            - secretRef: { name: cupboard-gateway-secrets }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }   # Rust is frugal; cluster is memory-bound
---
apiVersion: v1
kind: Service
metadata:
  name: cupboard-gateway
  namespace: cupboard-gateway
spec:
  selector: { app: cupboard-gateway }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cupboard-gateway
  namespace: cupboard-gateway
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      # single-label host so the existing *.vngenterprise.com wildcard cert covers it
      match: Host(`cupboard-gateway-staging.vngenterprise.com`)
      services:
        - name: cupboard-gateway
          port: 8080
  tls:
    store: { name: default }
