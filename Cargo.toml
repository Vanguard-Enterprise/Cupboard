[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/telemetry",
    "crates/db",
    "services/gateway",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
repository = "https://github.com/Vanguard-Enterprise/Cupboard"

[workspace.dependencies]
# Async runtime / web
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "catch-panic"] }

# Database
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls", "postgres", "macros", "migrate", "uuid", "chrono",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Errors / utils
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Internal crates
cupboard-domain = { path = "crates/domain" }
cupboard-telemetry = { path = "crates/telemetry" }
cupboard-db = { path = "crates/db" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
