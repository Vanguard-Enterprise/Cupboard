[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/telemetry",
    "crates/db",
    "crates/crypto",
    "crates/auth-core",
    "crates/gameconn",
    "crates/bus",
    "crates/bmapi",
    "services/gateway",
    "services/auth",
    "services/fleet",
    "services/collector",
    "services/identity",
    "services/metrics",
    "services/tenant",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
repository = "https://github.com/Vanguard-Enterprise/Cupboard"

[workspace.dependencies]
# Async runtime / web
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "catch-panic"] }

# Database
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls", "postgres", "macros", "migrate", "uuid", "chrono",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Game-server connections (Collector/Fleet). Rust's RCON is a WebSocket carrying JSON
# frames (not Source TCP RCON); ws:// is plaintext in practice, so no TLS feature here.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }

# Event bus — Redis Streams (Collector → Identity/Metrics consumer groups). The
# connection-manager feature adds the auto-reconnecting handle the tenant service's
# public-path site-resolve cache uses (a plain multiplexed connection stays down after
# a Redis restart; the cache must self-heal).
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "streams", "connection-manager"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# OpenTelemetry — pinned 0.32 matrix (tracing-opentelemetry 0.33 → otel 0.32).
# Bump these together; they share a tightly-coupled internal API. gRPC export to
# the cluster's alloy-receiver is plaintext in-cluster, so no TLS feature.
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "grpc-tonic", "trace", "metrics",
] }
tracing-opentelemetry = "0.33"

# Errors / utils
anyhow = "1"
thiserror = "2"
# v7 for client-generated, time-ordered ids in batch inserts (matches DB uuidv7()).
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Auth / crypto
# EdDSA (Ed25519) JWTs: auth signs, gateway verifies with the public key only.
jsonwebtoken = "9"
argon2 = { version = "0.5", features = ["std"] }
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
# Envelope encryption for tenant-supplied secrets at rest (RCON/panel creds): a random
# per-secret data key encrypts the value; the master key (from Vault) wraps the data key.
aes-gcm = "0.10"
# Gzip for privacy export bundles (Phase 7 decision C); pure-Rust backend by default.
flate2 = "1"
# Discord OAuth + internal HTTP (gateway → auth proxy). rustls, no native-tls.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# Signed cookies for OAuth state/PKCE (matches axum 0.8).
# NOTE: `cookie` 0.18.1 fails to compile against `time` >= 0.3.52, while
# `jsonwebtoken`'s `simple_asn1` requires `time` >= 0.3.47 — so `time` is pinned to
# 0.3.51 in Cargo.lock. Don't bump `time` past 0.3.51 until `cookie` catches up.
axum-extra = { version = "0.10", features = ["cookie", "cookie-signed", "typed-header"] }

# OpenAPI generation for the gateway's /api/v1 typed facade (Phase 6 decision O).
# Scalar over swagger-ui: lighter. Chosen partly to prove utoipa's transitive deps
# compile against the `time` 0.3.51 pin above before v1 breadth is built on it.
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.2"
utoipa-scalar = { version = "0.3", features = ["axum"] }

# Internal crates
cupboard-domain = { path = "crates/domain" }
cupboard-telemetry = { path = "crates/telemetry" }
cupboard-db = { path = "crates/db" }
cupboard-crypto = { path = "crates/crypto" }
cupboard-auth-core = { path = "crates/auth-core" }
cupboard-gameconn = { path = "crates/gameconn" }
cupboard-bus = { path = "crates/bus" }
cupboard-bmapi = { path = "crates/bmapi" }

# Full debuginfo balloons this workspace's debug target/ to ~19 GB, which has filled the
# dev machine's disk repeatedly. Line tables keep file:line in backtraces (all we use;
# no interactive debugger workflow here) at a fraction of the size.
[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
