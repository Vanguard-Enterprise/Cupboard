name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Rust toolchain
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://sh.rustup.rs --output "$RUNNER_TEMP/rustup-init.sh"
            sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal --default-toolchain none --no-modify-path
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - run: npm ci
      - run: npm run check
      - name: Build backend image
        run: docker build --file backend/Dockerfile --tag cupboard-api:check-${{ github.run_id }} .
      - name: Build web image
        run: docker build --file Dockerfile --tag cupboard-web:check-${{ github.run_id }} .
      - name: Verify release images and restart persistence
        run: node scripts/smoke-images.mjs cupboard-api:check-${{ github.run_id }} cupboard-web:check-${{ github.run_id }}
      - name: Save tested release images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save cupboard-api:check-${{ github.run_id }} cupboard-web:check-${{ github.run_id }} | gzip > "$RUNNER_TEMP/cupboard-images.tar.gz"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: tested-release-images
          path: ${{ runner.temp }}/cupboard-images.tar.gz
          compression-level: 0
          retention-days: 1
      - name: Remove check image
        if: always()
        run: docker image rm cupboard-api:check-${{ github.run_id }} cupboard-web:check-${{ github.run_id }} || true

  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tested-release-images
          path: ${{ runner.temp }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested images
        run: |
          docker load --input "$RUNNER_TEMP/cupboard-images.tar.gz"
          for runtime in api web; do
            image="ghcr.io/vanguard-enterprise/cupboard-${runtime}:sha-${{ github.sha }}"
            docker tag "cupboard-${runtime}:check-${{ github.run_id }}" "$image"
            docker push "$image"
          done
