name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Three independent jobs run in parallel. Each tool runs exactly once:
#   web     Node checks: format, lint, UI rules, types, unit tests, agent tests
#   rust    rustfmt, clippy, and the database-backed Rust tests
#   images  the release build (the only Next.js build) and the image smoke test
# `check` is the required status. `publish` pushes the images that passed.
jobs:
  web:
    name: Web checks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, ve-runner]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      # ESLint, Prettier, and tsc skip unchanged files, and Vitest starts the
      # slowest test files first, when they find their caches from earlier runs.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: web-checks-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: web-checks-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run check -- --web

  rust:
    name: Rust checks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, ve-runner]
    timeout-minutes: 30
    env:
      # Retry crates.io downloads so a brief network failure does not fail CI.
      CARGO_NET_RETRY: "10"
      CARGO_HTTP_TIMEOUT: "60"
      # Incremental data is large and rarely reused on a fresh runner.
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@v4
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
          key: rust-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Install Rust toolchain
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://sh.rustup.rs --output "$RUNNER_TEMP/rustup-init.sh"
            sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal --default-toolchain none --no-modify-path
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      # Paths stay relative or under $HOME: the cache version hashes them, and
      # each ephemeral runner checks out under a differently named directory,
      # so an absolute workspace path never matches a saved cache.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-build-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: rust-build-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
      - run: CUPBOARD_CHECK_CONTAINER="$HOSTNAME" npm run check -- --rust
      # Only main saves, so pull requests never evict its cache. Saving after a
      # failed run keeps dependencies cached even while main is red.
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-build-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}

  images:
    name: Release images
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, ve-runner]
    timeout-minutes: 30
    env:
      IMAGE_TAG: check-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # The host Docker daemon keeps layers and cache mounts between runs, so
      # unchanged dependencies are never rebuilt.
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - name: Build release images in parallel
        uses: docker/bake-action@v6
        with:
          source: .
          files: docker-bake.hcl
      - name: Verify release images and restart persistence
        run: CUPBOARD_CHECK_CONTAINER="$HOSTNAME" node scripts/smoke-images.mjs cupboard-api:${IMAGE_TAG} cupboard-web:${IMAGE_TAG}
      - name: Save tested release images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save cupboard-api:${IMAGE_TAG} cupboard-web:${IMAGE_TAG} | gzip -1 > "$RUNNER_TEMP/cupboard-images.tar.gz"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: tested-release-images
          path: ${{ runner.temp }}/cupboard-images.tar.gz
          compression-level: 0
          retention-days: 1
      - name: Remove check images
        if: always()
        run: docker image rm cupboard-api:${IMAGE_TAG} cupboard-web:${IMAGE_TAG} || true

  check:
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: [web, rust, images]
    runs-on: [self-hosted, Linux, X64, ve-runner]
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ needs.web.result }} ${{ needs.rust.result }} ${{ needs.images.result }}
        run: test "$RESULTS" = "success success success"

  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, ve-runner]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tested-release-images
          path: ${{ runner.temp }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested images
        run: |
          docker load --input "$RUNNER_TEMP/cupboard-images.tar.gz"
          for runtime in api web; do
            image="ghcr.io/vanguard-enterprise/cupboard-${runtime}:sha-${{ github.sha }}"
            docker tag "cupboard-${runtime}:check-${{ github.run_id }}-${{ github.run_attempt }}" "$image"
            docker push "$image"
          done
      - name: Remove published images
        if: always()
        run: |
          for runtime in api web; do
            docker image rm "cupboard-${runtime}:check-${{ github.run_id }}-${{ github.run_attempt }}" "ghcr.io/vanguard-enterprise/cupboard-${runtime}:sha-${{ github.sha }}" || true
          done
