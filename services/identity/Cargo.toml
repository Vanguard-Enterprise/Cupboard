[package]
name = "cupboard-identity"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cupboard-identity"
path = "src/main.rs"

[dependencies]
cupboard-domain.workspace = true
cupboard-telemetry.workspace = true
cupboard-db.workspace = true
cupboard-crypto.workspace = true
cupboard-auth-core.workspace = true
cupboard-bus.workspace = true
cupboard-bmapi.workspace = true

tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
# Cluster-internal client toward fleet's /internal/servers/import (BM servers phase).
reqwest.workspace = true
# Direct handle for the retention loop's stream time-trim (XTRIM MINID), which the
# Bus consumer API does not expose.
redis.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
# Retention-loop last-success gauge (decision L).
opentelemetry.workspace = true

[dev-dependencies]
cupboard-db.workspace = true
cupboard-domain.workspace = true
cupboard-crypto.workspace = true
cupboard-auth-core.workspace = true
# The in-process BattleMetrics stub server for import/sync end-to-end tests.
cupboard-bmapi = { workspace = true, features = ["stub"] }
sqlx.workspace = true
tokio.workspace = true
uuid.workspace = true
chrono.workspace = true
serde_json.workspace = true
# Drive the real router in-process (tower oneshot) for the /internal/bans/* tests.
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
