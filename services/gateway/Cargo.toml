[package]
name = "cupboard-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cupboard-gateway"
path = "src/main.rs"

[dependencies]
cupboard-domain.workspace = true
cupboard-telemetry.workspace = true
cupboard-db.workspace = true
cupboard-auth-core.workspace = true
# SHA-256 addressing for the in-process API-key exchange cache (the keyed hash of
# keys at rest lives in auth).
cupboard-crypto.workspace = true

tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
anyhow.workspace = true
chrono.workspace = true
uuid.workspace = true
# Reverse-proxy /auth/* to the auth service.
reqwest.workspace = true
# /api/v1 fixed-window rate limiter (Phase 6 decision N).
redis.workspace = true
# Fail-open counter metric for the rate limiter.
opentelemetry.workspace = true
# OpenAPI doc + Scalar UI for the /api/v1 typed facade (Phase 6 decision O).
utoipa.workspace = true
utoipa-axum.workspace = true
utoipa-scalar.workspace = true

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
