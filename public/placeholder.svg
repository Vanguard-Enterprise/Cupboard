<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">Cupboard server operations</title>
  <desc id="desc">An abstract dark blue and slate background for the Cupboard login page.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="0.55" stop-color="#1e293b" />
      <stop offset="1" stop-color="#334155" />
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.2" r="0.72">
      <stop offset="0" stop-color="#64748b" stop-opacity="0.48" />
      <stop offset="1" stop-color="#64748b" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#cbd5e1" stroke-opacity="0.08" />
    </pattern>
  </defs>
  <rect width="1200" height="1600" fill="url(#background)" />
  <rect width="1200" height="1600" fill="url(#glow)" />
  <rect width="1200" height="1600" fill="url(#grid)" />
</svg>
